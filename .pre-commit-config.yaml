repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.12.20
    hooks:
      - id: uv-export
        always_run: true
        args: [ --quiet, --no-dev, --locked, --output-file, requirements.txt ]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.10
    hooks:
      # Run the linter.
      - id: ruff-check
        types_or: [ python, pyi, jupyter ]
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format
        types_or: [ python, pyi, jupyter ]

  # Type checking con pyright. El hook instala su propia copia de pyright, así que
  # no requiere tenerlo en el proyecto ni en el sistema.
  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.414
    hooks:
      - id: pyright

