[project]
name = "voice-assistant"
version = "0.1.1"
description = "Asistente inteligente de voz"
readme = "README.md"
authors = [
    { name = "comejia", email = "cemejia555@gmail.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy<2",
    "openwakeword>=0.6.0",
    "pyaudio>=0.2.14",
    "python-dotenv>=1.2.4",
]

[project.scripts]
voice-assistant = "voice_assistant:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: pruebas que requieren hardware o datos reales (micrófono, archivos de audio)",
]
# Por defecto se excluyen las pruebas de integración.
# Para ejecutarlas: pytest -m integration
addopts = "-m 'not integration'"

[tool.semantic_release]
# La versión vive únicamente en pyproject.toml.
version_toml = ["pyproject.toml:project.version"]
# Permitir versiones 0.x: un patch/minor NO salta a 1.0.0 prematuramente.
allow_zero_version = true
# Tras actualizar la versión, re-sincronizar y re-stagear el uv.lock.
# (La acción corre en Docker sin uv, por eso se instala primero.)
build_command = """
    pip install uv
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
"""

[tool.semantic_release.branches.main]
match = "main"
