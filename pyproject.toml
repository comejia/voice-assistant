[project]
name = "voice-assistant"
version = "0.1.0"
description = "Asistente inteligente de voz"
readme = "README.md"
authors = [
    { name = "comejia", email = "cemejia555@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy<2",
    "openwakeword>=0.6.0",
    "pyaudio>=0.2.14",
    "python-dotenv>=1.2.4",
]

[project.scripts]
voice-assistant = "voice_assistant:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: pruebas que requieren hardware o datos reales (micrófono, archivos de audio)",
]
# Por defecto se excluyen las pruebas de integración.
# Para ejecutarlas: pytest -m integration
addopts = "-m 'not integration'"
